# Charge backend/.env s'il existe (format CLE=valeur)
spring.config.import=optional:file:.env[.properties]

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/animaltracking}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Mail (OTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Serveur
server.port=${SERVER_PORT:8081}
server.max-http-request-header-size=64KB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Application
app.upload-dir=${UPLOAD_DIR:./uploads}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8082,http://localhost:19006}
ocr.api.url=${OCR_API_URL:http://localhost:5001/extract_info}

# Logs (profil "dev" pour plus de détails)
spring.jpa.show-sql=false
logging.level.root=INFO


# Sécurité
app.jwt.secret=${JWT_SECRET}
app.jwt.ttl-hours=${JWT_TTL_HOURS:168}
app.gps.ingest-key=${GPS_INGEST_KEY}

# Supervision : seul /actuator/health est exposé ; un SMTP injoignable ne doit pas rendre l'application « DOWN »
management.endpoints.web.exposure.include=health
management.health.mail.enabled=false
